# KS1092 ECG application — Zephyr configuration
#
# Hardware drivers
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Bluetooth (LE peripheral, ESP32-S3 controller)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="BLE_EEG"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BUF_ACL_TX_SIZE=251

# 23 字节数据帧需要 ATT MTU >= 26（23 + 3 字节协议头）。
# 默认 RX/TX MTU 只有 23，必须调大并启用连接后自动 MTU 协商，
# 否则 ble_send_frame 会因 MTU 不足而拒绝发送（上位机无波形）。
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_RX_SIZE=70

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# C library features (double/float printf, math)
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y

# Heap (ESP32 BT controller needs extra memory pool)
CONFIG_HEAP_MEM_POOL_SIZE=40960